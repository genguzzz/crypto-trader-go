# crypto-trader-go on a server: a stock 2 MB runtime image + the static Go binary bind-mounted from
# ./bin. Upgrades never rebuild an image — deploy.sh swaps ./bin/ctg and restarts the container.
# Lives at /opt/ctg/docker-compose.yml on the server (next to bin/, data/, ctg.env).
name: ctg
services:
  ctg:
    image: gcr.io/distroless/static-debian12:nonroot   # CA certs + tzdata + nonroot user, nothing else
    container_name: ctg
    restart: unless-stopped
    network_mode: host                                 # listens on 127.0.0.1:8686; host nginx proxies it
    user: "65532:65532"
    entrypoint: ["/app/ctg"]
    command: ["-addr", "127.0.0.1:8686", "-db", "/data/ctg.db"]
    env_file: [ctg.env]                                # optional extra env (CTG_PROXY, CTG_ADMIN_KEY, CTG_SECRET_KEY), mode 600
    environment:
      CTG_RUN_DIR: /data/run                           # Unix sockets shared with ctg-strategy / ctg-ai
      GOMEMLIMIT: 1536MiB                             # live heap ~180 MB; a limit below it makes GC spin (~20 GC/s, 1.4 cores)
      GOGC: "75"
    volumes:
      - ./bin:/app:ro                                  # the only thing replaced on upgrade
      - ./data:/data                                   # SQLite + icon cache (settings/rules live in the DB)
    mem_limit: 2g                                      # ctg-prod has 4 GB
    stop_grace_period: 15s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Strategy supervisor: one Python process per running strategy instance. No network at all; the
  # only I/O is data/run/strategy.sock. Strategy code is bind-mounted so library updates need no rebuild.
  ctg-strategy:
    build: ./strategies
    image: ctg-strategy:local
    container_name: ctg-strategy
    restart: unless-stopped
    network_mode: none
    read_only: true
    tmpfs: [/tmp]
    user: "65532:65532"
    environment:
      CTG_RUN_DIR: /run/ctg
    volumes:
      - ./strategies:/app:ro
      - ./data/run:/run/ctg
    mem_limit: 768m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # AI review worker (Claude Agent SDK). Host network only to reach the local proxy inbound on
  # 127.0.0.1:17080 (x-ui/Xray → relay → residential-exit); the worker refuses to run without it.
  ctg-ai:
    build: ./ai
    image: ctg-ai:local
    container_name: ctg-ai
    restart: unless-stopped
    network_mode: host
    user: "65532:65532"
    environment:
      CTG_RUN_DIR: /run/ctg
      CTG_AI_PROXY: http://127.0.0.1:17080
      HOME: /home/agent                                # chat session transcripts (resume across turns and restarts)
    tmpfs: [/tmp]
    volumes:
      - ./data/run:/run/ctg
      - ./data/ai-home:/home/agent
      - ./data/sbx:/run/sbx                            # the sandbox's socket
    mem_limit: 1g
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Sandbox for the chat agent's shell tool: bash + Python (numpy/pandas) + the crypto-analyzer CLI.
  # Own bridge network (internet for OKX / news; host loopback services unreachable), no credentials
  # (the worker sends an in-memory read-only data key per command), read-only root, tmpfs work dirs.
  ctg-sandbox:
    build: ./ai/sandbox
    image: ctg-sandbox:local
    container_name: ctg-sandbox
    restart: unless-stopped
    read_only: true
    user: "65532:65532"
    tmpfs: ["/tmp:size=256m", "/work:size=512m,uid=65532,gid=65532"]
    volumes:
      - ./data/sbx:/run/sbx
    mem_limit: 512m
    pids_limit: 128
    cpus: 1.0
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
