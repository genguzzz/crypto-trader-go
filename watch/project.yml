# OKX Watch: a small iPhone companion + Apple Watch app (see README.md). Generate the Xcode project
# with `DEVELOPMENT_TEAM=<team id> xcodegen` (the project file is not committed).
name: OKXWatch
options:
  bundleIdPrefix: top.gugenzzz
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
settings:
  base:
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
targets:
  OKXWatch:
    type: application
    platform: iOS
    sources: [Phone, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: top.gugenzzz.okxwatch
        INFOPLIST_KEY_CFBundleDisplayName: OKX 手表助手
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: OKXWatchApp
  OKXWatchApp:
    type: application
    platform: watchOS
    sources: [Watch, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: top.gugenzzz.okxwatch.watchkitapp
        INFOPLIST_KEY_CFBundleDisplayName: OKX 助手
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: top.gugenzzz.okxwatch
        INFOPLIST_KEY_WKApplication: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
